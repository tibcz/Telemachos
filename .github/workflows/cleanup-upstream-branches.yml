name: Delete leftover upstream branches

# One-shot housekeeping. The repository began as a fork and kept the upstream
# project's working branches, which made the branch list read as somebody
# else's project. This removes exactly those, by name.
#
# It exists as a workflow rather than a plain `git push --delete` because a
# sandboxed environment's git gateway can refuse deletions, while the
# workflow's own token can always perform them through the API.
#
# Delete this file once it has run. It is deliberately explicit — it can only
# ever remove the fourteen branches named below, never a branch you add later.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete the upstream branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail

          branches="
          chore/dev-version-1.0.3
          copilot/fix-agent-linux-sandbox
          copilot/fix-dependency-review-job-failure
          dependabot/github_actions/actions-3d5f64b385
          dependabot/npm_and_yarn/npm-160fe27d7a
          dependabot/pip/python-846ad97ee7
          discovery
          feature/tbench-bounded-read-guard
          fix/add-directory-event-loop
          fix/api-token-agent-authorization
          fix/empty-assistant-continuation
          fix/searxng-retained-settings-upgrade
          main
          review/ghsa-86p3-security-forward-fix-2
          "

          deleted=0; missing=0; failed=0
          for b in $branches; do
            # Record the SHA first: an unreferenced commit stays recoverable on
            # GitHub for a while, and the log is the only place that SHA will
            # still exist afterwards.
            sha="$(gh api "repos/$REPO/git/ref/heads/$b" --jq .object.sha 2>/dev/null || true)"
            if [ -z "$sha" ]; then
              echo "  not present: $b"; missing=$((missing+1)); continue
            fi
            if gh api -X DELETE "repos/$REPO/git/refs/heads/$b" >/dev/null 2>&1; then
              echo "  deleted: $b (was $sha)"; deleted=$((deleted+1))
            else
              echo "  FAILED : $b (is $sha)"; failed=$((failed+1))
            fi
          done

          echo ""
          echo "deleted=$deleted missing=$missing failed=$failed"
          [ "$failed" -eq 0 ]
